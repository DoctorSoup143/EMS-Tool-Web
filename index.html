    <script>navigator.serviceWorker.register('service-worker.js');</script>

    <!-- Scroll Animations -->
    <script>
        console.log("scroll.js loaded"); // Debugging log
        window.initializeScrollEffects = function () {
            console.log("initializeScrollEffects called"); // Debugging log
            // Intersection Observer for reveal effect
            const revealContainers = document.querySelectorAll('.reveal-container');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-active');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1
            });

            revealContainers.forEach(container => {
                observer.observe(container);
            });

            // Intersection Observer for fade-in title
            const fadeInTitle = document.getElementById('fade-in-title');
            if (fadeInTitle) {
                const titleObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('fade-in');
                            titleObserver.unobserve(entry.target);
                        }
                    });
                }, {
                    threshold: 0.1
                });

                titleObserver.observe(fadeInTitle);
            }
        };
    </script>

    <!-- Audio JS -->
    <script>
        window.initializeAudio = function () {
            const soundButtons = document.querySelectorAll(".audio-button");

            soundButtons.forEach(button => {
                const audioSrc = button.getAttribute("data-audio-src");
                const audioPlayer = new Audio(audioSrc); // Create an audio object

                // Set the volume to 15%
                audioPlayer.volume = 0.15;

                button.addEventListener("click", function () {
                    audioPlayer.currentTime = 0; // Reset audio to the beginning
                    audioPlayer.play().catch(function (error) {
                        console.error('Error playing audio:', error);
                    });
                });

                audioPlayer.addEventListener('error', function () {
                    console.error('Error loading audio file:', audioSrc);
                });
            });
        };
    </script>
